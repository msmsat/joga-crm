# Весь продакшен одной командой:  docker compose up -d --build
# Переменные ниже берутся из корневого .env (см. .env.example рядом).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: velora
      POSTGRES_DB: velora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан в корневом .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velora"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./back
    # Все ключи (SECRET_KEY, Stripe, SMTP, Google, Telegram) берём из существующего
    # back/.env — второй копии секретов не заводим.
    env_file: ./back/.env
    environment:
      # Перебивает DATABASE_URL из env_file: в контейнере база не на localhost.
      DATABASE_URL: postgresql+asyncpg://velora:${POSTGRES_PASSWORD}@db:5432/velora
    ports:
      # Только для cloudflared: туннель api.jogaua.online смотрит сюда и отдаёт
      # мини-приложение и вебхуки напрямую, МИНУЯ Caddy. Через Caddy их не увести:
      # он режет префикс /api, а бот, Stripe и Meta уже знают голые пути
      # (/s/{id}, /global/*, /checkout/webhook/stripe) — так это и работало до докера.
      # 127.0.0.1 — из локальной сети порт не виден, наружу только через туннель.
      - "127.0.0.1:8000:8000"
    volumes:
      # Именованные тома, а НЕ ./back/static — папка отслеживается git-ом, и
      # загруженные клиентами файлы попадали бы в рабочую копию: git status вечно
      # грязный, а `git checkout .` перед обновлением стёр бы их подчистую.
      # Здесь они лежат вне дерева репозитория и переживают и пересборку, и git pull.
      - static_data:/app/static
      - uploads_data:/app/uploads
      # Собранный miniapp/dist: в образ он не попадает (build-контекст — ./back, а
      # main.py ищет его на уровень выше — /miniapp/dist). Монтируем с хоста, чтобы
      # не тащить фронтовую сборку в питоновский образ. Папки нет → мини-ап отдаёт
      # 404, но API живёт: main.py монтирует эти маршруты только если dist на месте.
      - ./miniapp/dist:/miniapp/dist:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./front
      args:
        VITE_API_URL: /api
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
    depends_on:
      - api
    restart: unless-stopped

  # Домашний ПК как сервер: белого IP и проброса портов не требует — соединение
  # исходящее. HTTPS терминирует Cloudflare, поэтому SITE_ADDRESS оставляем :80
  # (Caddy сам сертификат не получит: снаружи до его :80 не достучаться).
  # Не поднимается по умолчанию, только с  --profile tunnel.
  tunnel:
    image: cloudflare/cloudflared:latest
    # Именно ${...:-}, а не ${...:?}: compose подставляет переменные ДО применения
    # профилей, и обязательная переменная роняла бы обычный запуск на сервере,
    # где туннель не нужен. Пустой токен отловит сам cloudflared при старте.
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:-}
    profiles: [tunnel]
    depends_on:
      - web
    restart: unless-stopped

volumes:
  pgdata:        # база
  static_data:   # логотипы, фото филиалов и сотрудников
  uploads_data:  # прочие загрузки
  caddy_data:    # сертификаты Let's Encrypt
