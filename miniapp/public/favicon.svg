<!-- Знак Velora: те же четыре окошка, что в меню CRM и в мини-приложении.
     Нарисован в сетке 32: Chrome растрирует иконку вкладки в 16 и 32 пикселя
     (при 150% уменьшает 32-ю до 24), и плитки 14 / зазор 4 / скругление 4
     ложатся на целые пиксели в обоих размерах — при 16 это 7 / 2 / 2.
     Сетка 20 давала дробные края, и знак во вкладке мылился.
     Светлые плитки — сплошным цветом, а не прозрачностью: на голубоватом фоне
     неактивной вкладки прозрачный персик становился грязно-сиреневым.
     #FCCBBF — это персик 55% на светлом, #96665A — на тёмном. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .a { fill: #F9A08B }
    .b { fill: #FCCBBF }
    @media (prefers-color-scheme: dark) { .b { fill: #96665A } }
  </style>
  <rect class="a" width="14" height="14" rx="4" />
  <rect class="b" x="18" width="14" height="14" rx="4" />
  <rect class="b" y="18" width="14" height="14" rx="4" />
  <rect class="a" x="18" y="18" width="14" height="14" rx="4" />
</svg>
