<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Набор и порядок важны: Safari не понимает SVG в rel=icon и берёт .ico,
         остальные браузеры выбирают SVG как более подходящий тип. Без .ico
         Safari не находил ничего и рисовал во вкладке первую букву домена.
         apple-touch-icon нужен отдельно: без него «На экран Домой» на iPhone
         кладёт скриншот страницы вместо знака. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Velora</title>
    <!-- SDK Telegram: обычный (не module) скрипт, поэтому выполняется ДО main.tsx —
         hooks/useTelegram.ts читает window.Telegram.WebApp на импорте модуля.
         Без него внутри Telegram нет ни initData, ни ready()/expand(): приложение
         считает, что открыто в браузере, и просит вход по почте. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Manrope и только он: одна гарнитура на весь кабинет, иерархию держат
         кегль, вес и трекинг. Внизу <body> лежал второй список (Caveat,
         Cormorant Garamond, Marck Script) — его не использовал ни один экран,
         а качался он всегда; убран. -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
