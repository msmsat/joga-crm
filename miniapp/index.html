<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Иконка вкладки — только .ico, SVG сюда не подключать. Chrome рисует
         вкладку из кадров 16 и 32, а при масштабе 150% уменьшает кадр 32 до 24
         фильтром Lanczos3. Кадр 32 в favicon.ico рассчитан под это уменьшение,
         кадр 16 — под 100%; правый столбец при 24 оставлен пустым, иначе на
         вкладках со сдвигом в полпикселя он заворачивается к левому краю.
         SVG-иконку Chrome предпочёл бы .ico и растрировал бы сам — с дробными
         краями. favicon.svg остаётся файлом-логотипом (его отдаёт и back/main.py).
         apple-touch-icon нужен отдельно: без него «На экран Домой» на iPhone
         кладёт скриншот страницы вместо знака. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Оттенок, которым вебвью красит СВОИ поверхности: резинку переката за
         нижним краем документа и полосу под сворачивающейся панелью. Значения
         равны --v-background из index.css. Дефолт стоит здесь, чтобы полоса
         была верной уже в первом кадре; студийную тёмную тему подменяет
         lib/branding.ts, когда придёт каталог. -->
    <meta name="theme-color" content="#F4F2EF" />
    <title>Velora</title>
    <!-- SDK Telegram: обычный (не module) скрипт, поэтому выполняется ДО main.tsx —
         hooks/useTelegram.ts читает window.Telegram.WebApp на импорте модуля.
         Без него внутри Telegram нет ни initData, ни ready()/expand(): приложение
         считает, что открыто в браузере, и просит вход по почте.

         Подключается ТОЛЬКО при запуске из Telegram. Скрипт блокирует разбор
         страницы, пока не скачается с telegram.org (отдельное TLS-соединение,
         ~120 КБ): замерено 0,56–1,26 с на холодном кэше, и всё это время
         приложение не начинало даже грузиться. В браузере (ссылка студии из
         Instagram, с сайта) он не делает ничего полезного — initData там нет,
         а openLink вне Telegram — тот же window.open, — но держал каждое такое
         открытие. Признак запуска — тот же, по которому его ищет сам SDK:
         tgWebAppData в хэше адреса, а после перезагрузки внутри Telegram —
         в sessionStorage, куда SDK сохраняет параметры запуска. -->
    <script>
      (function () {
        // Хэш — «#tgWebAppData=…&…» или «#путь?tgWebAppData=…» (urlParseHashParams в SDK).
        var launched = /[#?&]tgWebAppData=/.test(location.hash);
        if (!launched) {
          try {
            launched = Boolean(JSON.parse(sessionStorage.getItem('__telegram__initParams') || '{}').tgWebAppData);
          } catch (e) { /* хранилище закрыто — значит, и сохранённого запуска нет */ }
        }
        if (launched) document.write('<script src="https://telegram.org/js/telegram-web-app.js"><\/script>');
      })();
    </script>
    <!-- Шрифт Manrope подключён в src/main.tsx (@fontsource), а не отсюда с
         CDN Google: тот получал IP каждого клиента без согласия. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
