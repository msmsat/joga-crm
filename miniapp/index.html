<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Набор и порядок важны: Safari не понимает SVG в rel=icon и берёт .ico,
         остальные браузеры выбирают SVG как более подходящий тип. Без .ico
         Safari не находил ничего и рисовал во вкладке первую букву домена.
         apple-touch-icon нужен отдельно: без него «На экран Домой» на iPhone
         кладёт скриншот страницы вместо знака. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Оттенок, которым вебвью красит СВОИ поверхности: резинку переката за
         нижним краем документа и полосу под сворачивающейся панелью. Значения
         равны --v-background из index.css. Дефолт стоит здесь, чтобы полоса
         была верной уже в первом кадре; студийную тёмную тему подменяет
         lib/branding.ts, когда придёт каталог. -->
    <meta name="theme-color" content="#F4F2EF" />
    <title>Velora</title>
    <!-- SDK Telegram: обычный (не module) скрипт, поэтому выполняется ДО main.tsx —
         hooks/useTelegram.ts читает window.Telegram.WebApp на импорте модуля.
         Без него внутри Telegram нет ни initData, ни ready()/expand(): приложение
         считает, что открыто в браузере, и просит вход по почте. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Шрифт Manrope подключён в src/main.tsx (@fontsource), а не отсюда с
         CDN Google: тот получал IP каждого клиента без согласия. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
