[pytest]
testpaths = tests

# tests/test_danger_zone.py написан на `async def`, а без плагина pytest их просто
# ПРОПУСКАЛ с предупреждением — четыре теста на удаление студии и очистку данных
# годами не выполнялись. `auto` включает их без расстановки маркеров по файлу;
# остальные тесты сидят на sync-функциях с asyncio.run() внутри и этим режимом
# не задеты.
asyncio_mode = auto

# Явно, иначе pytest-asyncio каждый прогон предупреждает о смене дефолта в
# следующей мажорной версии.
asyncio_default_fixture_loop_scope = function
