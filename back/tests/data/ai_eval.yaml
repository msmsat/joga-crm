  expect_text: [Ещё]
  forbid_text: [слева, левой колонке, боковом меню, "+ Сотрудник"]

- q: создать сотрудника
  viewport: desktop
  forbid_text: [нет такой, не существует, не могу найти]

- q: заморозить клиента
