# Набор проверки ассистента (эпик AI-6, задача 19).
#
# Не тесты, а лаборатория: каждый случай — реальный вопрос владельца с тем, что
# ответ ОБЯЗАН содержать и чего в нём быть НЕ должно. Прогон стоит денег (живая
# модель), поэтому это скрипт: python -m scripts.ai_eval
#
# forbid_text — не украшение. Половина провалов выглядит как «ответил уверенно
# и мимо»: назвал кнопку Журнала в ответе про сотрудников, сказал «слева»
# человеку с телефона, процитировал подпись, которой в продукте нет.
#
# Поля случая:
#   q               вопрос человека (обязательно)
#   role            owner | admin | trainer, по умолчанию owner
#   viewport        desktop | phone | tablet
#   page            маршрут, на котором «стоит» человек
#   lang            язык студии на время случая (ru по умолчанию)
#   expect_text     все подстроки обязаны быть в ответе (регистр не важен)
#   forbid_text     ни одной из подстрок в ответе быть не должно
#   expect_tool     инструмент обязан быть вызван
#   forbid_tool     инструмент вызывать нельзя
#   expect_proposal true — обязана появиться карточка подтверждения
#   forbid_proposal true — карточки быть не должно
#   expect_clarify  true — сервер обязан переспросить (список вариантов)
#   expect_intent   ассистент обязан открыть этот экран
#   expect_block    подстрока-блок в ответе (velora-chart, таблица)

# ─── Три жалобы владельца 15.08.2026, дословно ───────────────────────────────

