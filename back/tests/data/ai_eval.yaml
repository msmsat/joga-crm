# ─── Голос: живой администратор, а не справочная ─────────────────────────────
#
# Формулы вежливого робота ловятся только forbid_text: «ответил корректно и
# как автоответчик» — тот самый провал, на который человек жалуется словами
# «общается как ИИ». Проверять положительно («звучит живо») нечем, поэтому
# проверяем отрицательно: запрещённых оборотов в ответе быть не должно.

- q: сколько у нас клиентов
  forbid_text: ["конечно!", "отлично!", разумеется, "я могу помочь вам", "с радостью"]

- q: спасибо, помогло
  forbid_text: ["надеюсь, это помогло", "обращайтесь", "чем ещё я могу быть полезен",
                "рад был помочь", "всегда к вашим услугам"]

- q: а можешь показать выручку за июль
  forbid_text: ["конечно", "прекрасный вопрос", "отличный вопрос", "хороший вопрос"]

- q: я случайно удалил не того клиента
  forbid_text: ["не переживайте", "бывает!", "ничего страшного"]

- q: покажи занятия на завтра
  lang: en
  forbid_text: ["of course", "certainly", "i'd be happy to", "great question",
                "i hope this helps", "let me know if"]

# ─── График: названные человеком дни и часы главнее карточки тренера ─────────
#
# Дословная жалоба: «говорю создать на все следующие дни недели с 10 по 10, а
# он создаёт вторник четверг пятница и с 17 по 17». Причина была в схеме —
# передать часы модели было НЕЧЕМ. Проверяем не текст ответа, а аргументы:
# карточка появлялась одинаково и тогда, когда часы человека терялись.

- q: поставь Тимуру пилатес на всю следующую неделю с 10 до 22
  expect_tool: fill_schedule
  expect_proposal: true
  expect_args: {time_from: "10:00", time_to: "22:00"}

- q: заполни Тимуру расписание пилатесом по вторникам и четвергам на две недели вперёд
  expect_tool: fill_schedule
  expect_args: {weekdays: [1, 3]}

- q: поставь Тимуру пилатес на следующую неделю
  expect_tool: fill_schedule
  expect_proposal: true
  expect_args: {time_from: null, weekdays: null}

- q: со скольки до скольки работает Тимур
  forbid_text: [уточните, подскажите, "не знаю"]
