# ═══════════════════════════════════════════════════════════════════════════
# ЭТАП 0b — набор, переписанный вокруг настоящей задачи ассистента.
#
# Прежние 64 случая остаются выше без изменений: они регрессия, и трогать их
# незачем. Ниже — то, чего в наборе не было вовсе: многошаговые цепочки,
# сквозные по разделам сценарии, пары «одна фраза, разный контекст» и опасные
# действия.
#
# Новые поля случая (все необязательные, старые случаи их не знают):
#   category        своя категория для отчёта о составе; не задана — выводится
#   page            маршрут, на котором «стоит» человек — вход роутера
#   section         подраздел страницы (вкладка, открытая карточка)
#   entity          {type, name} — на какой записи он стоит
#   permissions     если отличаются от роли
#   active_workflow незавершённый сценарий
#   expect_tools    ПОСЛЕДОВАТЕЛЬНОСТЬ вызовов; лишние чтения между ними законны
#   expect_section  какой раздел обязан быть раскрыт (для роутера, этап 3)
#   expect_danger   действие обязано прийти карточкой danger
#
# Данные фикстуры, на которые опираются случаи ниже:
#   тренеры   Тимур Новак (вт/чт 17:00–21:00), Сара Новакова (пн–пт 9:00–18:00)
#   услуги    Пилатес 800/60мин, Хатха 600/90мин
#   залы      Зал А (8 мест), Зал Б (20 мест)
#   занятия   Пилатес завтра 10:00; два прошедших — 7 и 45 дней назад
#   клиенты   Анна Петрова (абонемент, ходила 7 дней назад),
#             Анна Сидорова (ходила 45 дней назад), 57 «КлиентN Тестовый»
#   деньги    касса, шесть месячных доходов «Абонементы», расход «Аренда зала»
# ═══════════════════════════════════════════════════════════════════════════

