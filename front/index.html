<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Набор и порядок важны: Safari не понимает SVG в rel=icon и берёт .ico,
         остальные браузеры выбирают SVG как более подходящий тип. Без .ico
         Safari не находил ничего и рисовал во вкладке первую букву домена.
         apple-touch-icon нужен отдельно: без него «На экран Домой» на iPhone
         кладёт скриншот страницы вместо знака. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- viewport-fit=cover — чтобы нижняя панель навигации на iPhone могла
         подложить env(safe-area-inset-bottom) под индикатор жестов. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Velora</title>
    <!-- Ставим .dark до первой отрисовки: иначе при theme=dark экран успевает
         мигнуть светлым, пока грузится React (ключ тот же, что THEME_STORAGE_KEY).
         ТОЛЬКО под /dashboard: тема — свойство кабинета, а лендинг, вход,
         регистрация и онбординг всегда светлые. Граница ровно та же, что у
         ThemeProvider: он монтируется в DashboardLayout и больше нигде. -->
    <script>
      try {
        if (location.pathname.indexOf('/dashboard') === 0) {
          // Ключ затравки — на аккаунт (`velora_theme:<email>`, см. utils/auth.ts),
          // поэтому email достаём из payload токена: чужую тему не подхватим.
          var tk = localStorage.getItem('token');
          var sub = tk && JSON.parse(atob(tk.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).sub;
          var t = sub && localStorage.getItem('velora_theme:' + sub);
          if (t === 'dark' || (t === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches))
            document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
