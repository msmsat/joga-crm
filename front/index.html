<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Иконка вкладки — только .ico, SVG сюда не подключать. Chrome рисует
         вкладку из кадров 16 и 32, а при масштабе 150% уменьшает кадр 32 до 24
         фильтром Lanczos3. Кадр 32 в favicon.ico рассчитан под это уменьшение,
         кадр 16 — под 100%; правый столбец при 24 оставлен пустым, иначе на
         вкладках со сдвигом в полпикселя он заворачивается к левому краю.
         SVG-иконку Chrome предпочёл бы .ico и растрировал бы сам — с дробными
         краями. favicon.svg — это логотип для страниц (оформление оплаты).
         apple-touch-icon нужен отдельно: без него «На экран Домой» на iPhone
         кладёт скриншот страницы вместо знака. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- viewport-fit=cover — чтобы нижняя панель навигации на iPhone могла
         подложить env(safe-area-inset-bottom) под индикатор жестов. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Velora</title>
    <!-- Ставим .dark до первой отрисовки: иначе при theme=dark экран успевает
         мигнуть светлым, пока грузится React (ключ тот же, что THEME_STORAGE_KEY).
         ТОЛЬКО под /dashboard: тема — свойство кабинета, а лендинг, вход,
         регистрация и онбординг всегда светлые. Граница ровно та же, что у
         ThemeProvider: он монтируется в DashboardLayout и больше нигде. -->
    <script>
      try {
        if (location.pathname.indexOf('/dashboard') === 0) {
          // Ключ затравки — на аккаунт (`velora_theme:<email>`, см. utils/auth.ts),
          // поэтому email достаём из payload токена: чужую тему не подхватим.
          var tk = localStorage.getItem('token');
          var sub = tk && JSON.parse(atob(tk.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))).sub;
          var t = sub && localStorage.getItem('velora_theme:' + sub);
          // auto — по часам устройства (6:00-18:00 светлая), а не по
          // prefers-color-scheme: тот отражает статичный тумблер ОС и не
          // меняется сам в течение дня. Условие то же, что в isAutoDark()
          // из ThemeContext.tsx.
          var h = new Date().getHours();
          if (t === 'dark' || (t === 'auto' && (h < 6 || h >= 18)))
            document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
